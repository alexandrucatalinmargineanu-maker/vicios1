[package]
name = "vos"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
semver = "1"
ed25519-dalek = "2"
tar = "0.4"
flate2 = "1"
fs2 = "0.4"
tempfile = "3"
libc = "0.2"
